[package]
name = "nail"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
    "fs",
    "io-util",
] }


hyper = { version = "1", features = [
    "server",
    "http1",
] }

hyper-util = { version = "0.1", features = [
    "tokio",
] }

http-body-util = "0.1"
bytes = "1"
chrono = "0.4.45"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
serde_urlencoded = "0.7"
humantime = "2"

reqwest =  "0.12"
futures = "0.3"
itertools = "0.14"
regex = "1.13.1"
